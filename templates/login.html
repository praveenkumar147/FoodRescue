{% extends "base.html" %}

{% block title %}Login - FoodRescue{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center animate-fade-in-up" style="min-height: 70vh;">
    <div class="col-12 col-md-7 col-lg-5">
        <div class="card shadow-lg border-0">
            <div class="card-header-gradient text-center py-4">
                <span class="fs-1 mb-2 d-block">🔒</span>
                <h3 class="fw-bold mb-0 text-white">Welcome Back</h3>
                <p class="text-white-50 mb-0 mt-1 small">Sign in to manage your food rescue activities</p>
            </div>
            
            <div class="card-body p-4 p-md-5">
                <form method="post" novalidate autocomplete="off">
                    <!-- Role input -->
                    <div class="mb-3">
                        <label for="roleInput" class="form-label">Select Your Role</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-tag"></i></span>
                            <select id="roleInput" name="role" class="form-select border-start-0" autocomplete="off" required>
                                <option value="" disabled selected>-- Select Role --</option>
                                <option value="donor">Donor (Restaurant, Hotel, Home)</option>
                                <option value="receiver">Receiver (Shelter, Charity, Food Bank)</option>
                                <option value="admin">Administrator</option>
                            </select>
                        </div>
                    </div>

                    <!-- Email input -->
                    <div class="mb-3">
                        <label for="emailInput" class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                            <input id="emailInput" name="email" type="email" class="form-control border-start-0" autocomplete="off" required>
                        </div>
                    </div>
                    
                    <!-- Password input -->
                    <div class="mb-4">
                        <label for="passwordInput" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-shield-lock"></i></span>
                            <input id="passwordInput" name="password" type="password" class="form-control border-start-0" autocomplete="off" required>
                        </div>
                    </div>
                    
                    <!-- Login button -->
                    <button type="submit" class="btn btn-success w-100 py-2.5 fs-6 mb-3">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Log In
                    </button>
                    
                    <div class="text-center mt-3">
                        <p class="small text-muted mb-0">Don't have an account yet? 
                            <a href="{{ url_for('register') }}" class="text-success fw-bold text-decoration-none">Register here</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
